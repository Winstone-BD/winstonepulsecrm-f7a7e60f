# Official company-signed Winstone Connect APK (owner decision 2026-11-02: Git builds allowed).
#
# Runs only when started by hand (Actions → "Android official release" → Run workflow) and only
# inside the protected "android-release" environment, so an approver must confirm each run.
# The company key lives only in this repository's encrypted secrets; it is written to the
# runner's temp folder (outside the project), used by scripts/build-signed-apk.sh, and erased.
# The approved signer fingerprint is pinned below: a different key always fails the build.
name: Android official release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 45
    env:
      # Public certificate fingerprint of the approved company key (v2.3 signer). Not a secret.
      WINSTONE_RELEASE_CERT_SHA256: "2E:61:50:E6:06:52:45:C1:B2:B5:41:37:51:2D:63:ED:40:0D:22:9B:88:1D:1B:91:5A:29:06:17:4E:1C:7E:6D"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Restore company key (temp folder, outside the project)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "OFFICIAL RELEASE BLOCKED: secret ANDROID_KEYSTORE_BASE64 is not set" >&2; exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/winstone-release.jks"
          echo "WINSTONE_KEYSTORE_PATH=$RUNNER_TEMP/winstone-release.jks" >> "$GITHUB_ENV"

      - name: Build, sign and verify (fails on any other signer, package or version)
        env:
          WINSTONE_KEYSTORE_PASSWORD: ${{ secrets.WINSTONE_KEYSTORE_PASSWORD }}
          WINSTONE_KEY_ALIAS: ${{ secrets.WINSTONE_KEY_ALIAS }}
          WINSTONE_KEY_PASSWORD: ${{ secrets.WINSTONE_KEY_PASSWORD }}
        run: bash scripts/build-signed-apk.sh

      - name: Erase company key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/winstone-release.jks"

      - name: Keep the APK, checksum and release record (private to this repository)
        uses: actions/upload-artifact@v4
        with:
          name: winstone-connect-official-release
          path: |
            android/release-out/*.apk
            android/release-out/*.sha256
            android/release-out/*.release-record.txt
          if-no-files-found: error
          retention-days: 14
