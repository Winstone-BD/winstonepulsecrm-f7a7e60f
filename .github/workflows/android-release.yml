# Official company-signed Winstone Connect APK (owner decision 2026-11-02: Git builds allowed).
#
# Start by hand: Actions → "Android official release" → Run workflow. Runs only inside the
# protected "android-release" environment, so an approver must confirm each run.
# Order: check secrets (names only) → check version → restore key to runner temp →
# build/sign/verify with scripts/build-signed-apk.sh → erase key → re-verify the three
# release files → write SHA256SUMS + provenance → upload only those 5 files for 7 days.
# The approved signer fingerprint is pinned below: a different key always fails the build.
name: Android official release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Version name this run must produce"
        required: true
        default: "2.22"
      expected_version_code:
        description: "Version code this run must produce"
        required: true
        default: "33"

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 45
    env:
      # Public certificate fingerprint of the approved company key (v2.3 signer). Not a secret.
      WINSTONE_RELEASE_CERT_SHA256: "2E:61:50:E6:06:52:45:C1:B2:B5:41:37:51:2D:63:ED:40:0D:22:9B:88:1D:1B:91:5A:29:06:17:4E:1C:7E:6D"
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
    steps:
      - name: Official builds run only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "OFFICIAL RELEASE BLOCKED: run this workflow from main (got $GITHUB_REF)" >&2
            exit 1
          fi
      - name: Check required signing secrets (names only, values never printed)
        env:
          S_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          S_STORE_PASSWORD: ${{ secrets.WINSTONE_KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.WINSTONE_KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.WINSTONE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${S_KEYSTORE:-}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${S_STORE_PASSWORD:-}" ] || missing+=("WINSTONE_KEYSTORE_PASSWORD")
          [ -n "${S_KEY_ALIAS:-}" ] || missing+=("WINSTONE_KEY_ALIAS")
          [ -n "${S_KEY_PASSWORD:-}" ] || missing+=("WINSTONE_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "OFFICIAL RELEASE BLOCKED: missing secrets in environment android-release: ${missing[*]}" >&2
            exit 1
          fi
          echo "All 4 signing secrets are set."

      - uses: actions/checkout@v4

      - name: Check the project version matches this run
        run: |
          set -euo pipefail
          f=android/app/build.gradle.kts
          code="$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' "$f" | head -n1 | grep -oE '[0-9]+')"
          name="$(grep -E '^[[:space:]]*versionName[[:space:]]*=' "$f" | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$name" != "$EXPECTED_VERSION" ] || [ "$code" != "$EXPECTED_VERSION_CODE" ]; then
            echo "OFFICIAL RELEASE BLOCKED: project is $name ($code), this run expects $EXPECTED_VERSION ($EXPECTED_VERSION_CODE)" >&2
            exit 1
          fi
          echo "Project version $name ($code) matches."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      # Gradle dependency/wrapper cache from the tests workflow, READ-ONLY here: a release
      # run never saves a cache, so nothing from a signing run (key, passwords, signed
      # outputs) can enter it. Configuration cache stays off (it could hold env values).
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
          cache-disabled: false

      - name: Restore company key (temp folder, outside the project)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          # Windows PowerShell Base64 often carries CR/LF or spaces; strip them before decoding.
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/winstone-release.jks" 2>/dev/null; then
            rm -f "$RUNNER_TEMP/winstone-release.jks"
            echo "PREFLIGHT FAILED: ANDROID_KEYSTORE_BASE64 is not valid Base64. Re-encode the .jks file and update the secret." >&2
            exit 1
          fi
          echo "WINSTONE_KEYSTORE_PATH=$RUNNER_TEMP/winstone-release.jks" >> "$GITHUB_ENV"

      # Proves keystore, store password, alias, key password and signer BEFORE the long
      # Gradle build. Passwords reach keytool only through -storepass:env / -keypass:env
      # (never argv), keytool output is captured and never echoed, and every failure
      # prints a fixed message naming which secret to fix - never a value.
      - name: Preflight - validate signing secrets and keystore (values never printed)
        env:
          PF_STORE_PASSWORD: ${{ secrets.WINSTONE_KEYSTORE_PASSWORD }}
          PF_KEY_ALIAS: ${{ secrets.WINSTONE_KEY_ALIAS }}
          PF_KEY_PASSWORD: ${{ secrets.WINSTONE_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          ks="$WINSTONE_KEYSTORE_PATH"
          fail() { echo "PREFLIGHT FAILED: $1" >&2; rm -f "$RUNNER_TEMP/preflight.csr"; exit 1; }

          [ -s "$ks" ] || fail "decoded keystore is empty. ANDROID_KEYSTORE_BASE64 must hold the whole .jks file."
          size="$(stat -c %s "$ks")"
          [ "$size" -ge 1000 ] || fail "decoded keystore is only $size bytes - the secret looks truncated."
          magic="$(head -c 4 "$ks" | od -An -tx1 | tr -d ' \n')"
          case "$magic" in
            feedfeed) kind="JKS" ;;
            30*) kind="PKCS12" ;;
            *) fail "decoded file is not a JKS or PKCS12 keystore. ANDROID_KEYSTORE_BASE64 holds the wrong file." ;;
          esac
          echo "Keystore decoded: $kind, $size bytes."

          if ! out="$(keytool -list -keystore "$ks" -storepass:env PF_STORE_PASSWORD 2>&1)"; then
            if printf '%s' "$out" | grep -qiE 'password was incorrect|tampered|final block|pad'; then
              fail "WINSTONE_KEYSTORE_PASSWORD does not open this keystore."
            fi
            fail "keytool could not read the keystore (corrupted file or unsupported format)."
          fi
          echo "Store password opens the keystore."

          keytool -list -keystore "$ks" -storepass:env PF_STORE_PASSWORD -alias "$PF_KEY_ALIAS" >/dev/null 2>&1 \
            || fail "WINSTONE_KEY_ALIAS is not an entry in this keystore (aliases are case-sensitive)."
          echo "Key alias exists."

          # certreq must sign with the private key, so it proves the key password unlocks it.
          if ! keytool -certreq -keystore "$ks" -storepass:env PF_STORE_PASSWORD -alias "$PF_KEY_ALIAS" \
               -keypass:env PF_KEY_PASSWORD -file "$RUNNER_TEMP/preflight.csr" >/dev/null 2>&1; then
            fail "WINSTONE_KEY_PASSWORD does not unlock the key (this is the 'Given final block not properly padded' error)."
          fi
          rm -f "$RUNNER_TEMP/preflight.csr"
          echo "Key password unlocks the signing key."

          got="$(keytool -list -v -keystore "$ks" -storepass:env PF_STORE_PASSWORD -alias "$PF_KEY_ALIAS" 2>/dev/null \
                 | grep -m1 -E '^[[:space:]]*SHA256:' | sed -E 's/^[[:space:]]*SHA256:[[:space:]]*//' | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          want="$(printf '%s' "$WINSTONE_RELEASE_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          [ -n "$got" ] || fail "could not read the signing certificate from the key entry."
          if [ "$got" != "$want" ]; then
            # Fingerprints are public certificate facts, safe to print.
            fail "this key is not the approved company signer (got $got, expected $want)."
          fi
          echo "Signer matches the approved company fingerprint. Preflight passed."

      - name: Build, sign and verify (fails on any other signer, package or version)
        env:
          WINSTONE_KEYSTORE_PASSWORD: ${{ secrets.WINSTONE_KEYSTORE_PASSWORD }}
          WINSTONE_KEY_ALIAS: ${{ secrets.WINSTONE_KEY_ALIAS }}
          WINSTONE_KEY_PASSWORD: ${{ secrets.WINSTONE_KEY_PASSWORD }}
        run: bash scripts/build-signed-apk.sh

      - name: Erase company key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/winstone-release.jks"

      - name: Re-check the release files before upload
        working-directory: android/release-out
        run: |
          set -euo pipefail
          base="winstone-connect-${EXPECTED_VERSION}-${EXPECTED_VERSION_CODE}-release.apk"
          for f in "$base" "$base.sha256" "$base.release-record.txt"; do
            [ -f "$f" ] || { echo "OFFICIAL RELEASE BLOCKED: $f missing" >&2; exit 1; }
          done
          count="$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')"
          [ "$count" = "3" ] || { echo "OFFICIAL RELEASE BLOCKED: expected exactly 3 release files, found $count" >&2; exit 1; }
          sha256sum -c "$base.sha256"
          grep -q "^Package:[[:space:]]*com.winstone.connect$" "$base.release-record.txt"
          grep -q "^Version:[[:space:]]*${EXPECTED_VERSION} (code ${EXPECTED_VERSION_CODE})$" "$base.release-record.txt"
          fp="$(printf '%s' "$WINSTONE_RELEASE_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          grep -q "^Signer SHA-256:[[:space:]]*${fp} " "$base.release-record.txt"
          echo "RELEASE_APK=$base" >> "$GITHUB_ENV"
          echo "Verified: $base"

      - name: Write SHA256SUMS and build provenance (public facts only)
        working-directory: android/release-out
        run: |
          set -euo pipefail
          sha256sum "$RELEASE_APK" "$RELEASE_APK.release-record.txt" > SHA256SUMS
          apk_sha="$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          fp="$(printf '%s' "$WINSTONE_RELEASE_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          cat > build-provenance.json <<JSON
          {
            "package": "com.winstone.connect",
            "version_name": "${EXPECTED_VERSION}",
            "version_code": ${EXPECTED_VERSION_CODE},
            "apk": "${RELEASE_APK}",
            "apk_sha256": "${apk_sha}",
            "signer_sha256": "${fp}",
            "source_repository": "${GITHUB_REPOSITORY}",
            "source_ref": "${GITHUB_REF}",
            "source_commit": "${GITHUB_SHA}",
            "workflow_run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "started_by": "${GITHUB_ACTOR}",
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "SIGNED - not approved for agent phones until the real-device test passes"
          }
          JSON
          python3 -m json.tool build-provenance.json > /dev/null
          sha256sum -c SHA256SUMS

      - name: Upload only the verified release files (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: winstone-connect-${{ inputs.expected_version }}-official-release
          path: |
            android/release-out/${{ env.RELEASE_APK }}
            android/release-out/${{ env.RELEASE_APK }}.sha256
            android/release-out/${{ env.RELEASE_APK }}.release-record.txt
            android/release-out/SHA256SUMS
            android/release-out/build-provenance.json
          if-no-files-found: error
          retention-days: 7
