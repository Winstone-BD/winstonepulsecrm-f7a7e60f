# Android unit tests on every change to the phone app. No secrets, no signing, no APK upload.
name: Android tests

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android-tests.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-tests.yml"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      # Caches only Gradle's downloaded dependencies and wrapper (~/.gradle caches).
      # This job has no secrets. Only pushes to main save the cache; PRs read it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: Unit tests
        working-directory: android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          mkdir -p build/ci-logs
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee build/ci-logs/gradle-unit-tests.log

      # Readable reports for every run (HTML report + JUnit XML). This job has no
      # secrets, and only test output folders are uploaded — never the project,
      # local.properties, keystores or APKs.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.run_number }}
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-failure-log-${{ github.run_number }}
          path: android/build/ci-logs/gradle-unit-tests.log
          if-no-files-found: ignore
          retention-days: 7
