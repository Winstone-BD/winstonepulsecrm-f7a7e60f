# Android unit tests on every change to the phone app. No secrets, no signing, no APK upload.
name: Android tests

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android-tests.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-tests.yml"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - name: Unit tests
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest
